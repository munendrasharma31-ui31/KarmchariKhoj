<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Employee Information Portal | Govt. of Uttar Pradesh</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
  /* subtle elevation */
  .elevated {
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
</style>
</head>

<body class="bg-slate-100 text-slate-800">

<!-- ================= HEADER ================= -->
<header class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-blue-800 text-white">
  <div class="max-w-7xl mx-auto px-6 py-10 grid md:grid-cols-2 gap-8 items-center">

    <div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide">
        आन्तरिक लेखा एवं लेखा परीक्षा निदेशालय
      </h1>
      <p class="mt-2 text-lg opacity-90">
        Directorate of Internal Audit & Accounts
      </p>
      
    </div>

    <div class="text-right">
      <a href="admin-login.html"
        class="inline-block bg-white text-indigo-800
        font-bold px-6 py-3 rounded-xl elevated">
        🔐 Admin Login
      </a>
    </div>

  </div>
</header>

<!-- ================= SEARCH PANEL ================= -->
<section class="relative -mt-12">
  <div class="max-w-6xl mx-auto px-6">
    <div class="bg-white rounded-3xl p-8 elevated">

      <h2 class="text-xl font-bold text-indigo-800 mb-1">
        Employee Search
      </h2>
      <p class="text-sm text-slate-500 mb-6">
        Office aur District ke madhyam se khoj karein
      </p>

      <div class="grid md:grid-cols-3 gap-6">
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase">
            Office
          </label>
          <select id="officeDrop"
            class="mt-2 w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500">
            <option value="">Select Office</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase">
            District
          </label>
          <select id="districtDrop"
            class="mt-2 w-full border rounded-xl p-3 focus:ring-2 focus:ring-indigo-500">
            <option value="">Select District</option>
          </select>
        </div>

        <button id="searchBtn"
          class="bg-indigo-700 hover:bg-indigo-800
          text-white font-bold rounded-xl text-lg">
          Search Records
        </button>
      </div>

    </div>
  </div>
</section>

<!-- ================= RESULTS ================= -->
<section class="max-w-7xl mx-auto px-6 py-14">
  <div id="result" class="hidden"></div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="bg-slate-900 text-slate-300 text-sm">
  <div class="max-w-7xl mx-auto px-6 py-6 text-center">
    © 2025 आन्तरिक लेखा एवं लेखा परीक्षा निदेशालय  
    <br> Government of Uttar Pradesh
  </div>
</footer>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDE0Oy6bSo05jl48kugFnrtHAPZt-eanA",
  authDomain: "antrik-lekha.firebaseapp.com",
  projectId: "antrik-lekha",
  appId: "1:82198306544:web:bfb58e6c8d03f7d664ac35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const officeDrop = document.getElementById("officeDrop");
const districtDrop = document.getElementById("districtDrop");
const searchBtn = document.getElementById("searchBtn");
const result = document.getElementById("result");

let allEmployees = [];

/* LOAD DATA */
const snap = await getDocs(collection(db,"employees"));
allEmployees = snap.docs.map(d=>d.data());

/* OFFICE */
[...new Set(allEmployees.map(e=>(e.office||"").trim()))]
  .filter(Boolean).sort()
  .forEach(o=>officeDrop.innerHTML+=`<option>${o}</option>`);

/* DISTRICT */
officeDrop.onchange = ()=>{
  districtDrop.innerHTML = `<option value="">Select District</option>`;
  result.classList.add("hidden");

  const off = officeDrop.value.toLowerCase();

  [...new Set(
    allEmployees
      .filter(e=>(e.office||"").toLowerCase()===off)
      .map(e=>(e.district||"").trim())
  )].filter(Boolean).sort()
   .forEach(d=>districtDrop.innerHTML+=`<option>${d}</option>`);
};

/* SEARCH */
searchBtn.onclick = ()=>{
  result.innerHTML="";
  result.classList.remove("hidden");

  const o = officeDrop.value.toLowerCase();
  const d = districtDrop.value.toLowerCase();

  const filtered = allEmployees.filter(e =>
    (e.office||"").toLowerCase()===o &&
    (e.district||"").toLowerCase()===d
  );

  if(!filtered.length){
    result.innerHTML = `
      <div class="text-center text-slate-500 py-16">
        No records found
      </div>`;
    return;
  }

  result.innerHTML = `<div class="grid md:grid-cols-3 gap-8"></div>`;
  const grid = result.firstElementChild;

  filtered.forEach(e=>{
   grid.innerHTML += `
  <div class="bg-white rounded-2xl p-6 elevated">
    <div class="font-bold text-lg text-indigo-800">
      ${e.name}
    </div>

    <div class="text-sm mt-2">📞 ${e.phone}</div>

    <div class="text-sm mt-1">
      🏢 ${e.office}
    </div>

    <div class="text-sm">
      📍 ${e.district}
      ${e.block ? ` / ${e.block}` : ""}
    </div>

    <span class="inline-block mt-4 text-xs
      bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">
      ${e.post}
    </span>
  </div>`;

  });
};
</script>

</body>
</html>
