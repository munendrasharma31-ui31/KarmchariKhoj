<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>आन्तरिक लेखा एवं लेखा परीक्षा निदेशालय | Public Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<!-- HEADER -->
<header class="bg-indigo-700 text-white py-4">
  <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">
        आन्तरिक लेखा एवं लेखा परीक्षा निदेशालय
      </h1>
      <p class="text-sm opacity-90">Public Employee Dashboard</p>
    </div>

    <!-- ✅ ADMIN LOGIN BUTTON -->
    <a href="admin-login.html"
       class="bg-white text-indigo-700 font-bold px-4 py-2 rounded-xl hover:bg-slate-100">
      🔐 Admin Login
    </a>
  </div>
</header>

<main class="max-w-5xl mx-auto p-6 space-y-10">

<!-- SEARCH SECTION -->
<section class="bg-white p-6 rounded-2xl shadow">
  <h2 class="text-lg font-bold mb-4 text-indigo-700">
    🔍 Search Employees
  </h2>

  <div class="grid md:grid-cols-3 gap-4">
    <select id="officeDrop" class="border p-3 rounded-xl">
      <option value="">Select Office</option>
    </select>

    <select id="districtDrop" class="border p-3 rounded-xl">
      <option value="">Select District</option>
    </select>

    <button id="searchBtn"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-3">
      Show Employees
    </button>
  </div>

  <div id="result" class="hidden mt-6"></div>
</section>

</main>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBDE0Oy6bSo05jl48kugFnrtHAPZt-eanA",
  authDomain: "antrik-lekha.firebaseapp.com",
  projectId: "antrik-lekha",
  appId: "1:82198306544:web:bfb58e6c8d03f7d664ac35"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ELEMENTS */
const officeDrop = document.getElementById("officeDrop");
const districtDrop = document.getElementById("districtDrop");
const searchBtn = document.getElementById("searchBtn");
const result = document.getElementById("result");

let allEmployees = [];

/* LOAD ALL EMPLOYEES */
const snap = await getDocs(collection(db, "employees"));
allEmployees = snap.docs.map(d => d.data());

/* OFFICE DROPDOWN */
[...new Set(allEmployees.map(e => e.office))]
  .sort()
  .forEach(office => {
    officeDrop.innerHTML += `<option value="${office}">${office}</option>`;
  });

/* DISTRICT DROPDOWN */
officeDrop.onchange = () => {
  districtDrop.innerHTML = `<option value="">Select District</option>`;
  result.classList.add("hidden");

  if (!officeDrop.value) return;

  [...new Set(
    allEmployees
      .filter(e => e.office === officeDrop.value)
      .map(e => e.district)
  )]
  .sort()
  .forEach(dist => {
    districtDrop.innerHTML += `<option value="${dist}">${dist}</option>`;
  });
};

/* SHOW EMPLOYEES */
searchBtn.onclick = () => {
  result.innerHTML = "";
  result.classList.remove("hidden");

  if (!officeDrop.value || !districtDrop.value) {
    result.innerHTML =
      "<p class='text-red-600 font-semibold'>Please select Office & District</p>";
    return;
  }

  const filtered = allEmployees.filter(e =>
    e.office === officeDrop.value &&
    e.district === districtDrop.value
  );

  if (filtered.length === 0) {
    result.innerHTML =
      "<p class='text-red-600 font-semibold'>No employees found</p>";
    return;
  }

  filtered.forEach(e => {
    result.innerHTML += `
      <div class="bg-slate-50 p-4 rounded-xl mb-3 space-y-1">
        <div class="font-bold text-lg">${e.name}</div>
        <div>📞 ${e.phone}</div>
        <div>🏢 ${e.office}</div>
        <div>📍 ${e.district}</div>
        <div>👔 ${e.post}</div>
      </div>`;
  });
};
</script>

</body>
</html>
